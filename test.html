<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AALIYAA Bot</title>
<style>
body{margin:0;font-family:Arial;background:#111;display:flex;justify-content:center}
.chat{width:400px;height:100vh;background:#ece5dd;display:flex;flex-direction:column}
.header{background:#075e54;color:white;padding:15px;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:10px}
.msg{padding:8px 12px;border-radius:8px;margin:5px;max-width:80%}
.user{background:#dcf8c6;align-self:flex-end;margin-left:auto}
.bot{background:white}
img.food{width:100%;border-radius:8px;margin-top:5px}
.input-area{display:flex;padding:10px;background:#f0f0f0}
input{flex:1;padding:10px;border-radius:20px;border:1px solid #ccc}
button{margin-left:5px;padding:10px 15px;background:#075e54;color:white;border:none;border-radius:20px}
.menu-img{width:100%;border-radius:8px;margin:5px 0}
</style>
</head>
<body>
<div class="chat">
<div class="header">🍛 Hotel AALIYAA - Demo Bot</div>
<div class="messages" id="msgs"></div>
<div class="input-area">
<input id="inp" placeholder="Type hi...">
<button onclick="send()">Send</button>
</div>
</div>
<script>
const MENU_PICS = {
"1":"https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400",
"2":"https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=400",
"3":"https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=400",
"4":"https://images.unsplash.com/photo-1512621776952-a57141f2eefd?w=400"
};
function addMsg(t,who){
 let d=document.createElement('div'); d.className='msg '+who;
 if(t.includes('http')){
   d.innerHTML = t.replace(/(https:\/\/[^\s]+)/g,'<img class="food" src="$1">');
 } else {
   d.innerText=t;
 }
 if(t.includes('MENU') || t.includes('Paneer')){
   let html=t.replace(/\n/g,'<br>');
   for(let k in MENU_PICS){
     if(t.includes(k)) html+=`<br><img class="menu-img" src="${MENU_PICS[k]}">`;
   }
   // show all menu pics on hi
   if(t.includes('Vanakkam')){
     html+='<br>';
     for(let k in MENU_PICS){ html+=`<img class="menu-img" src="${MENU_PICS[k]}"><br>Item ${k}<br>`; }
   }
   d.innerHTML=html;
 }
 document.getElementById('msgs').appendChild(d);
 document.getElementById('msgs').scrollTop=99999;
}
async function send(){
 let txt=document.getElementById('inp').value;
 if(!txt) return;
 addMsg(txt,'user');
 document.getElementById('inp').value='';
 let res=await fetch('/fake-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt})});
 let data=await res.json();
 setTimeout(()=>addMsg(data.reply,'bot'),500);
}
document.getElementById('inp').addEventListener('keypress',e=>{if(e.key==='Enter')send();});
addMsg('Vanakkam! Hotel AALIYAA\nMENU:\n1 Paneer Rs220\n2 Biryani Rs180\n3 Dosa Rs120\n4 Meals Rs150\nType 1-4 to order','bot');
</script>
</body>
</html>
